name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v4

      - name: Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Встановити залежності й зібрати React
        run: |
          npm ci
          npm run build

      - name: Залити React (dist/) у корінь сайту (htdocs)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ./htdocs/
          # Безпечно: за замовчуванням action НЕ видаляє файли на сервері,
          # яких немає локально — тому wp-admin/wp-content/.htaccess
          # залишаються недоторканими.
          exclude: |
            **/wp-admin/**
            **/wp-content/**
            **/wp-includes/**
            **/.htaccess
            **/wp-config.php
            **/*.php

  # Крок деплою плагіна поки прибрано — у цьому репозиторії немає папки
  # з кодом плагіна (wordpress-plugin/pavit-acf-bootstrap/). Якщо додасте
  # її в репозиторій, скажіть — поверну цей крок з правильним шляхом.
